[project]
name = "score-capture"
version = "0.2.0"
description = "Capture, Detect, Stitch and Reclip music score/TAB from scroll video to generate printable images."
readme = "README.md"
license = {text = "GPLv3"}
requires-python = ">=3.13"
dependencies = [
    "fast-ssim>=1.3.0",
    "fonttools>=4.59.2",
    "joblib>=1.5.3",
    "loguru>=0.7.3",
    "mss>=10.1.0",
    "numba>=0.64.0",
    "numpy>=2.4.0",
    "numpydantic>=1.7.0",
    "opencv-python>=4.13.0.92",
    "pathvalidate>=3.3.1",
    "pillow>=11.2.1",
    "pydantic>=2.12.5",
    "pydantic-extra-types>=2.10.6",
    "pyffmpeg>=2.5.2.3.1",
    "pyqtgraph==0.13.7",
    "pyside6==6.9.0",
    "pyside6-qtads==4.4.0",
]

[dependency-groups]
dev = [
    "imageio>=2.37.2",
    "ipykernel>=7.1.0",
    "nuitka>=2.8.10",
    "pympler>=1.1",
    "zstandard>=0.25.0",
]

[tool.uv]
# This prevents 'uv run' and 'uv sync' from including dev dependencies by default
default-groups = []

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "src/View/ui"  # Compiled ui file
]
# Same as Black.
line-length = 88
indent-width = 4

[tool.ty.environment]
root = ["."]
